name: Release

on:
  push:
    tags:
      - 'dedupe-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the release-notes step below resolves the previous
          # dedupe-v tag and logs the commit range since it. The default shallow
          # checkout has neither, so PREV_TAG comes back empty and the notes
          # collapse to just the tagged commit.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plugin (Emby 4.9.x)
        run: |
          VERSION=${GITHUB_REF_NAME#dedupe-v}
          dotnet publish Emby.Xtream.Plugin/Emby.Xtream.Plugin.csproj \
            -c Release -o out --no-self-contained -p:Version=$VERSION

      - name: Build plugin (Emby 4.10+)
        run: |
          VERSION=${GITHUB_REF_NAME#dedupe-v}
          dotnet publish Emby.Xtream.Plugin/Emby.Xtream.Plugin.csproj \
            -c Release_4_10 -o out_4_10 --no-self-contained -p:Version=$VERSION

      - name: Generate release notes
        id: notes
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^dedupe-v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # This is a FORK, so the commit range after an upstream merge is mostly upstream's
          # work. Listing it as bullets under "What's Changed" reads as though this fork wrote
          # it, which is neither accurate nor fair to upstream. So the two are separated.
          #
          # --first-parent is what does it, and it needs no upstream remote (CI has none):
          # upstream's commits enter as the SECOND parent of the merge commit, so walking only
          # first parents excludes them by construction. No SHA lists, no heuristics, nothing
          # to keep in sync.
          UPSTREAM_REPO="firestaerter3/emby-xtream"
          OURS=$(git log "$RANGE" --first-parent --no-merges --pretty=format:"- %s" | grep -v "Co-Authored-By" || true)

          # Counts come from `git rev-list --count`, NOT `git log --pretty | wc -l`: the latter
          # emits no trailing newline, so it undercounts by one. The subtraction below hides
          # that most of the time (both terms are short by one) but not when the fork
          # contributes zero commits, where it would silently report one commit too few.
          TOTAL_NM=$(git rev-list --count --no-merges "$RANGE")
          OURS_NM=$(git rev-list --count --first-parent --no-merges "$RANGE")
          UPSTREAM_N=$((TOTAL_NM - OURS_NM))
          UPSTREAM_MERGE=$(git log "$RANGE" --first-parent --merges --pretty=format:"%H" | head -1)
          if [ -n "$UPSTREAM_MERGE" ]; then
            UPSTREAM_SHA=$(git rev-parse --short "${UPSTREAM_MERGE}^2")
          else
            UPSTREAM_SHA=""
          fi

          # `|| true` on the grep above is load-bearing: grep exits 1 when it selects no lines,
          # and run: blocks execute under `bash -e`, so an EMPTY commit range failed the whole
          # step rather than producing an empty section. That happens whenever PREV_TAG resolves
          # to the tag being built — which is what backfilling historical tags does, since the
          # resolution above takes the second-newest tag overall rather than the one preceding
          # this ref. An empty What's Changed is a fine outcome; a failed release is not.
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$OURS" ]; then
              echo "$OURS"
            else
              echo "_No fork-specific changes in this release._"
            fi
            echo ""
            if [ -n "$UPSTREAM_SHA" ]; then
              echo ""
              echo "## Upstream"
              echo ""
              echo "Merged with upstream [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) through \`${UPSTREAM_SHA}\`, bringing in ${UPSTREAM_N} commits of their work. Those changes are upstream's, not this fork's — see [their releases](https://github.com/${UPSTREAM_REPO}/releases) for what they cover."
              echo ""
            fi
            echo ""
            echo "## Downloads"
            echo ""
            echo "- **Emby 4.9.x** — \`Emby.Xtream.Plugin.dll\` (what the update check offers)"
            echo "- **Emby 4.10.0.17 and later** — \`Emby.Xtream.Plugin-4.10.dll\` — **rename to \`Emby.Xtream.Plugin.dll\` before installing**"
            echo ""
            echo "Install one, not both. Emby 4.10 left beta and reached general release in September 2026, so most installs will want the second."
            echo ""
            echo "> ⚠️ **The 4.10 download must be renamed.** The two builds cannot share a filename in one release, but **Emby names each plugin's settings file after the DLL** — so installing it as \`Emby.Xtream.Plugin-4.10.dll\` gives it a separate settings file. The plugin loads, the settings page opens, and everything you had configured appears blank, with no error. Your settings are not lost; rename the file to \`Emby.Xtream.Plugin.dll\` and they come back."
            echo ""
            echo "This fork's own changes are described in plain language in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)."
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            fi
          } > release_notes.md

      - name: Create release
        run: |
          # Rename 4.10 DLL so both assets coexist in the release
          cp out_4_10/Emby.Xtream.Plugin.dll out_4_10/Emby.Xtream.Plugin-4.10.dll
          gh release create "$GITHUB_REF_NAME" \
            out/Emby.Xtream.Plugin.dll \
            out_4_10/Emby.Xtream.Plugin-4.10.dll \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}