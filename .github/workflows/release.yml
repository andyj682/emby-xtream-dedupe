name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # One DLL for Emby 4.9 and 4.10, compiled against the 4.9 SDK (ADR-017).
      - name: Build plugin
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet publish Emby.Xtream.Plugin/Emby.Xtream.Plugin.csproj \
            -c Release -o out --no-self-contained -p:Version=$VERSION

      # Neither step produces a release file. They stop the release if the DLL would not
      # load on one of the two Emby versions.
      - name: Compile against Emby 4.10 SDK
        run: dotnet build Emby.Xtream.Plugin/Emby.Xtream.Plugin.csproj -c Release_4_10 -v minimal

      - name: Load plugin against Emby 4.9 and 4.10 SDKs
        run: |
          for sdk in emby4_9 emby4_10; do
            dotnet run --project scripts/sdk-load-check -- out/Emby.Xtream.Plugin.dll lib/$sdk
          done

      - name: Generate release notes
        id: notes
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # Build notes from commit messages (skip merge commits)
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --no-merges --pretty=format:"- %s" | grep -v "Co-Authored-By"
            echo ""
            echo ""
            echo ""
            echo "## Downloads"
            echo ""
            echo "\`Emby.Xtream.Plugin.dll\` works on Emby 4.9 and 4.10. \`Emby.Xtream.Plugin-4.10.dll\` is the same file under its old name, kept so that 4.10 installs from before this change still update correctly."
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            fi
          } > release_notes.md

      - name: Create release
        run: |
          # The same DLL under both names. The in-plugin updater downloads Emby.Xtream.Plugin.dll,
          # and people who installed the old 4.10 build by hand look for the -4.10 name, so both
          # must stay present and both must be the file that loads.
          cp out/Emby.Xtream.Plugin.dll out/Emby.Xtream.Plugin-4.10.dll
          gh release create "$GITHUB_REF_NAME" \
            out/Emby.Xtream.Plugin.dll \
            out/Emby.Xtream.Plugin-4.10.dll \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}